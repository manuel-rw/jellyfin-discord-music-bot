<!DOCTYPE html>
<html class="h-full bg-gray-100 dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { clifford: '#da373d' },
          },
        },
      };
    </script>
    <title>Jellyfin Discord Bot</title>
  </head>
  <body class="h-full bg-zinc-900">
    <nav class="bg-zinc-800">
      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <div class="flex h-16 items-center justify-between">
          <div class="flex items-center">
            <div class="flex-shrink-0">
              <img class="h-8 w-8" src="https://raw.githubusercontent.com/manuel-rw/jellyfin-discord-music-bot/master/images/icons/jellyfin-icon-squared.png" alt="Jellyfin logo" />
            </div>
            <span class="ml-5 text-gray-300 text-lg">Discord Bot</span>
          </div>
        </div>
      </div>
    </nav>

    <div class="mx-auto max-w-lg py-8 px-4">
      <!-- Connection Status -->
      <div class="flex justify-center gap-6 mb-6 text-sm" id="connectionStatus">
        <div class="flex items-center gap-2">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-gray-500" id="jellyfinDot"></span>
          <span class="text-gray-400">Jellyfin</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-gray-500" id="discordDot"></span>
          <span class="text-gray-400">Discord</span>
        </div>
        <div class="text-gray-500" id="voiceInfo"></div>
      </div>

      <!-- Player Card -->
      <div class="bg-zinc-800 rounded-2xl p-6 shadow-xl">
        <div class="flex items-start gap-5">
          <!-- Album Art -->
          <div class="w-24 h-24 rounded-xl bg-zinc-700 flex-shrink-0 overflow-hidden flex items-center justify-center" id="artworkContainer">
            <svg id="defaultIcon" class="w-12 h-12 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M9 18V5l12-2v13" />
              <circle cx="6" cy="18" r="3" />
              <circle cx="18" cy="16" r="3" />
            </svg>
            <img id="albumArt" class="hidden w-full h-full object-cover" alt="Album art" />
          </div>

          <!-- Track Info -->
          <div class="flex-1 min-w-0">
            <div class="text-gray-100 font-semibold text-lg truncate" id="trackName">Not playing</div>
            <div class="text-gray-400 text-sm mt-1" id="trackStatus">Waiting for a track...</div>
            <div class="mt-3 w-full h-1.5 bg-zinc-700 rounded-full overflow-hidden">
              <div class="h-full bg-purple-500 rounded-full transition-all duration-300" id="progressFill" style="width:0%"></div>
            </div>
          </div>
        </div>

        <!-- Controls -->
        <div class="flex items-center justify-center gap-3 mt-6">
          <button class="text-gray-300 hover:text-white hover:bg-zinc-700 p-2.5 rounded-full transition" id="prevBtn" onclick="previous()">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
          </button>
          <button class="bg-purple-600 hover:bg-purple-500 text-white p-3.5 rounded-full transition" id="playBtn" onclick="togglePause()">
            <svg id="playIcon" class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pauseIcon" class="hidden w-6 h-6" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
          </button>
          <button class="text-gray-300 hover:text-white hover:bg-zinc-700 p-2.5 rounded-full transition" id="stopBtn" onclick="stop()">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h12v12H6z"/></svg>
          </button>
          <button class="text-gray-300 hover:text-white hover:bg-zinc-700 p-2.5 rounded-full transition" id="nextBtn" onclick="next()">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>
        </div>

        <!-- Volume -->
        <div class="flex items-center gap-3 mt-5">
          <svg class="w-4 h-4 text-gray-500 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M11 5L6 9H2v6h4l5 4V5z" />
            <path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07" />
          </svg>
          <input type="range" min="0" max="1" step="0.01" value="1" class="w-full h-1.5 bg-zinc-700 rounded-full appearance-none cursor-pointer accent-purple-500 [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:w-3.5 [&::-webkit-slider-thumb]:h-3.5 [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:bg-purple-500" id="volumeSlider" oninput="setVolume(this.value)" />
        </div>

        <!-- Queue Info -->
        <div class="text-center text-gray-500 text-xs mt-4" id="queueInfo"></div>
      </div>
    </div>

    <script src="assets/js/app.js"></script>
  </body>
</html>
